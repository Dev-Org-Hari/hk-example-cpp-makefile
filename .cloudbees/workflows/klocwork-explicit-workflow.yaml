name: klocwork-explicit-workflow
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  build:
    steps:
      - name: checkout-source-code
        uses: cloudbees-io/checkout@v2

      - name: Run Klocwork Scan
        id: klocwork-step
        uses: cloudbees-io/perforce-klocwork-sast-plugin@CBP-62208
        with:
          url: ${{ vars.KLOCWORK_URL }}
          password: ${{ secrets.KLOCWORK_APP_TOKEN }}
          username:  ${{ vars.KLOCWORK_USERNAME }}
          build-tool: make
          build-options: make all --ignore-errors -j14
          license-host: klocwork-license.saas-qa.beescloud.com
          
      - id: print-outputs-from-klockwork-step
        name: print outputs from upstream Klocwork step
        uses: docker://alpine:latest
        run: |
          echo "Outputs from upstream Klocwork step:"
          echo "Critical count: ${{ steps.klocwork-step.outputs.critical-count }}"
          echo "Very high count: ${{ steps.klocwork-step.outputs.very-high-count }}"
          echo "High count: ${{ steps.klocwork-step.outputs.high-count }}"
          echo "Medium count: ${{ steps.klocwork-step.outputs.medium-count }}"
          echo "Low count: ${{ steps.klocwork-step.outputs.low-count }}"
          echo "Policy Subject: ${{ steps.klocwork-step.outputs.policy-subject }}"
